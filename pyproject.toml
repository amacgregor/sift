[project]
name = "reviewgate"
version = "0.1.0"
description = "Eval harness for PR triage and review-finding quality under scarce human attention"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Allan MacGregor" }]
dependencies = []

[project.optional-dependencies]
llm = ["openai>=1.40.0"]
dev = ["pytest>=8.0"]

[project.scripts]
reviewgate = "reviewgate.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
